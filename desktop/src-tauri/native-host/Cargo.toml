[package]
name = "nedra-native-host"
version = "5.0.0"
edition = "2021"
publish = false
description = "The native-messaging host of the Nedra browser extension: relays between the browser and the running desktop app."

[dependencies]
nedra-extension-link = { path = "../extension-link" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# The QA identity (com.nedra.desktop.qa, below NEDRA_QA_ROOT).
qa = []

[dev-dependencies]
proptest = "1"
tempfile = "3"

# Not "nedra-native-host": Tauri copies the bundled sidecar to
# target/<profile>/nedra-native-host, which would overwrite this build.
[[bin]]
name = "native-host"
path = "src/main.rs"
