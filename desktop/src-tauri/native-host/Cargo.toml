[package]
name = "nedra-native-host"
version = "5.0.6"
edition = "2021"
publish = false
description = "The native-messaging host of the Nedra browser extension: relays between the browser and the running desktop app."

[dependencies]
nedra-extension-link = { path = "../extension-link" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []





[[bin]]
name = "native-host"
path = "src/main.rs"
